async function init(){

  try{

      const external = await fetch('./data/learning.json').then(r=>r.json());
      if(external && Object.keys(external).length) learning = external;
    }
  }catch(e){}

    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  }
}

async function loadHadith(){let b=document.getElementById('book').value,n=document.getElementById('hn').value,h=document.getElementById('hr');h.innerHTML='<p class="muted">Memuat hadis...</p>';try{let j=await fetch(`${API_HADITH}/${b}/${n}`).then(r=>r.json());let c=j.data.contents;h.innerHTML=`<div class="item"><span class="badge">${j.data.name} No. ${c.number}</span><div class="arabic">${c.arab||''}</div><p class="muted">${c.id||''}</p><button class="btn primary" onclick="speak('${esc(c.arab||c.id)}','Hadis ${j.data.name}')">🔊 Audio Hadis</button><button class="btn" onclick="mark('hadith_${b}_${n}')">✓ Selesai</button></div>`}catch(e){h.innerHTML='<p class="muted">Gagal memuat hadis. Periksa koneksi.</p>'}}
function murattal(){return `<div class="hero"><h2>Murattal Premium</h2><p>Buka Quran, pilih surat, lalu tekan Murattal Surat. Audio MP3 akan berjalan ayat demi ayat.</p><button class="btn primary" onclick="view='quran';render()">Buka Quran</button></div>`}
function practice(){return `<div class="hero"><h2>Latihan Pelafalan</h2><p>Gunakan mikrofon browser untuk latihan. Ini fondasi awal latihan mandiri; untuk koreksi tajwid otomatis diperlukan model speech khusus.</p></div><div class="grid"><div class="card half"><textarea id="target" rows="5">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ</textarea><button class="btn primary" onclick="speak(document.getElementById('target').value,'Target latihan')">🔊 Dengar Target</button><button class="btn" onclick="rec()">🎙️ Rekam</button></div><div class="card half"><h3>Hasil</h3><p id="rr" class="muted">Belum mulai.</p></div></div>`}
function rec(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){toast('Speech recognition belum tersedia');return}let r=new R();r.lang='ar-SA';r.onresult=e=>document.getElementById('rr').textContent=e.results[0][0].transcript;r.start()}

function quiz(){let pool=[...(learning.hijaiyah||[]).slice(0,12),...(learning.tajwid||[]).slice(0,8),...(learning.doa||[]).slice(0,8)];let q=pool[Math.floor(Math.random()*pool.length)]||{arabic:'بِسْمِ اللّٰهِ',name:'Bismillah',meaning:'Dengan nama Allah'};let opts=[q.name||q.latin||q.meaning,'Al-Fatihah','Ruku','Doa tidur','Idzhar Halqi'].filter(Boolean);opts=[...new Set(opts)].sort(()=>Math.random()-.5).slice(0,4);if(!opts.includes(q.name||q.latin||q.meaning))opts[0]=q.name||q.latin||q.meaning;window.currentQuiz={answer:q.name||q.latin||q.meaning,id:q.id||'quiz'};return `<div class="hero"><h2>Quiz Pintar</h2><p>Latihan cepat untuk mengingat huruf, tajwid, doa, dan bacaan. Jawab pertanyaan, dengarkan audionya, lalu tandai progres.</p></div><div class="grid"><div class="card half"><span class="badge">Tebak materi</span><div class="arabic big">${q.arabic}</div><p class="muted">${q.meaning||'Pilih jawaban yang paling sesuai.'}</p><button class="btn primary" onclick="playLearning(${JSON.stringify(q).replaceAll("'","&#39;")})">🔊 Dengar</button></div><div class="card half"><h3>Pilihan Jawaban</h3><div class="list">${opts.map(o=>`<button class="btn" onclick="checkQuiz('${esc(o)}')">${o}</button>`).join('')}</div><button class="btn" onclick="view='quiz';render()">Soal Baru</button></div></div>`}
function checkQuiz(ans){if(!window.currentQuiz)return;let ok=ans===window.currentQuiz.answer;toast(ok?'Benar, progres tersimpan':'Belum tepat, coba soal lain');if(ok)mark('quiz_'+window.currentQuiz.id)}

const ALDORA_PRO_VERSION='11.0 Perfect Edition';
function getStats(){
  const keys=['hijaiyah','iqro','tajwid','sholat','doa'];
  const embedded=keys.reduce((a,k)=>a+(learning[k]||[]).length,0);
  const done=Object.keys(S.progress||{}).length;
  const bm=(S.bookmarks||[]).length;
  const pct=Math.min(100,Math.round(done/Math.max(embedded,1)*100));
  return {embedded,done,bm,pct,hijaiyah:(learning.hijaiyah||[]).length,iqro:(learning.iqro||[]).length,tajwid:(learning.tajwid||[]).length,sholat:(learning.sholat||[]).length,doa:(learning.doa||[]).length};
}
function proToast(t){toast(t)}
const oldUpdateProgress=updateProgress;
updateProgress=function(){
  const st=getStats();
  const p=Math.min(100,Math.round(st.done/180*100));
  const bar=document.getElementById('bar'), pct=document.getElementById('pct');
  if(bar)bar.style.width=p+'%';
  if(pct)pct.textContent=p+'% progres • '+st.done+' selesai • v'+ALDORA_PRO_VERSION;
}
function openFirstTodo(k){view=k;render();setTimeout(()=>{const first=[...document.querySelectorAll('.lcard')].find(e=>!S.progress[e.dataset.id]); if(first) first.scrollIntoView({behavior:'smooth',block:'center'});},80)}
function exportProgress(){
  const payload={app:'Aldora Mengaji Enterprise',version:ALDORA_PRO_VERSION,exportedAt:new Date().toISOString(),progress:S.progress||{},bookmarks:S.bookmarks||[]};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='aldora-mengaji-progress.json'; a.click(); URL.revokeObjectURL(a.href);
}

{id:'doa_28',category:'Pakaian',name:'Melepas pakaian',arabic:'بِسْمِ اللّٰهِ',latin:'Bismillaah',meaning:'Dengan nama Allah.',audioText:'بِسْمِ اللّٰهِ'},
{id:'doa_29',category:'Perjalanan',name:'Naik kendaraan',arabic:'سُبْحَانَ الَّذِيْ سَخَّرَ لَنَا هٰذَا وَمَا كُنَّا لَهُ مُقْرِنِيْنَ وَاِنَّا اِلَى رَبِّنَا لَمُنْقَلِبُوْنَ',latin:'Subhaanalladzii sakhkhara lanaa haadzaa wa maa kunnaa lahu muqriniin wa innaa ilaa rabbinaa lamunqalibuun',meaning:'Maha Suci Allah yang menundukkan kendaraan ini untuk kami, dan kepada Tuhan kami akan kembali.',audioText:'سُبْحَانَ الَّذِيْ سَخَّرَ لَنَا هٰذَا وَمَا كُنَّا لَهُ مُقْرِنِيْنَ وَاِنَّا اِلَى رَبِّنَا لَمُنْقَلِبُوْنَ'},
{id:'doa_30',category:'Perjalanan',name:'Doa safar ringkas',arabic:'اللّٰهُمَّ اِنَّا نَسْأَلُكَ فِيْ سَفَرِنَا هٰذَا الْبِرَّ وَالتَّقْوَى',latin:'Allaahumma innaa nas-aluka fii safarinaa haadzal birra wat taqwaa',meaning:'Ya Allah, kami memohon kebaikan dan takwa dalam perjalanan ini.',audioText:'اللّٰهُمَّ اِنَّا نَسْأَلُكَ فِيْ سَفَرِنَا هٰذَا الْبِرَّ وَالتَّقْوَى'},
{id:'doa_31',category:'Ilmu & Belajar',name:'Sebelum belajar',arabic:'رَبِّ زِدْنِيْ عِلْمًا وَارْزُقْنِيْ فَهْمًا',latin:'Rabbi zidnii ‘ilman warzuqnii fahmaa',meaning:'Ya Tuhanku, tambahkanlah ilmuku dan berikanlah aku pemahaman.',audioText:'رَبِّ زِدْنِيْ عِلْمًا وَارْزُقْنِيْ فَهْمًا'},
{id:'doa_32',category:'Ilmu & Belajar',name:'Dimudahkan urusan',arabic:'رَبِّ اشْرَحْ لِيْ صَدْرِيْ وَيَسِّرْ لِيْ اَمْرِيْ',latin:'Rabbisyrah lii shadrii wa yassir lii amrii',meaning:'Ya Tuhanku, lapangkan dadaku dan mudahkan urusanku.',audioText:'رَبِّ اشْرَحْ لِيْ صَدْرِيْ وَيَسِّرْ لِيْ اَمْرِيْ'},
{id:'doa_33',category:'Orang Tua & Keluarga',name:'Doa orang tua',arabic:'رَبِّ اغْفِرْ لِيْ وَلِوَالِدَيَّ وَارْحَمْهُمَا كَمَا رَبَّيَانِيْ صَغِيْرًا',latin:'Rabbighfir lii waliwaalidayya warhamhumaa kamaa rabbayaanii shaghiiraa',meaning:'Ya Tuhanku, ampunilah aku dan kedua orang tuaku, sayangilah mereka sebagaimana mereka mendidikku waktu kecil.',audioText:'رَبِّ اغْفِرْ لِيْ وَلِوَالِدَيَّ وَارْحَمْهُمَا كَمَا رَبَّيَانِيْ صَغِيْرًا'},
{id:'doa_34',category:'Orang Tua & Keluarga',name:'Keluarga sakinah',arabic:'رَبَّنَا هَبْ لَنَا مِنْ اَزْوَاجِنَا وَذُرِّيّٰتِنَا قُرَّةَ اَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِيْنَ اِمَامًا',latin:'Rabbanaa hab lanaa min azwaajinaa wa dzurriyyaatinaa qurrata a’yunin waj‘alnaa lil muttaqiina imaamaa',meaning:'Ya Tuhan kami, anugerahkan pasangan dan keturunan penyejuk hati, dan jadikan kami pemimpin orang bertakwa.',audioText:'رَبَّنَا هَبْ لَنَا مِنْ اَزْوَاجِنَا وَذُرِّيّٰتِنَا قُرَّةَ اَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِيْنَ اِمَامًا'},
{id:'doa_35',category:'Kesehatan',name:'Menjenguk orang sakit',arabic:'لَا بَأْسَ طَهُوْرٌ اِنْ شَاءَ اللّٰهُ',latin:'Laa ba-sa thahuurun in syaa-allaah',meaning:'Tidak apa-apa, semoga menjadi penyuci dosa insya Allah.',audioText:'لَا بَأْسَ طَهُوْرٌ اِنْ شَاءَ اللّٰهُ'},
{id:'doa_36',category:'Kesehatan',name:'Mohon kesembuhan',arabic:'اَللّٰهُمَّ رَبَّ النَّاسِ اَذْهِبِ الْبَأْسَ اِشْفِ اَنْتَ الشَّافِيْ',latin:'Allaahumma rabban naasi adzhibil ba-sa isyfi antasy syaafii',meaning:'Ya Allah Tuhan manusia, hilangkan penyakit, sembuhkanlah, Engkaulah Maha Penyembuh.',audioText:'اَللّٰهُمَّ رَبَّ النَّاسِ اَذْهِبِ الْبَأْسَ اِشْفِ اَنْتَ الشَّافِيْ'},
{id:'doa_37',category:'Keselamatan',name:'Kebaikan dunia akhirat',arabic:'رَبَّنَا اٰتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْاٰخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ',latin:'Rabbanaa aatinaa fid dunyaa hasanah wa fil aakhirati hasanah wa qinaa ‘adzaaban naar',meaning:'Ya Tuhan kami, berikanlah kebaikan di dunia dan akhirat, serta lindungi kami dari azab neraka.',audioText:'رَبَّنَا اٰتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْاٰخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ'},
{id:'doa_38',category:'Keselamatan',name:'Perlindungan dari keburukan',arabic:'اللّٰهُمَّ اِنِّيْ اَعُوْذُ بِكَ مِنْ جَهْدِ الْبَلَاءِ وَدَرَكِ الشَّقَاءِ وَسُوْءِ الْقَضَاءِ',latin:'Allaahumma innii a’uudzu bika min jahdil balaa-i wa darakisy syaqaa-i wa suu-il qadhaa',meaning:'Ya Allah, aku berlindung kepada-Mu dari beratnya musibah, kesengsaraan, dan takdir yang buruk.',audioText:'اللّٰهُمَّ اِنِّيْ اَعُوْذُ بِكَ مِنْ جَهْدِ الْبَلَاءِ وَدَرَكِ الشَّقَاءِ وَسُوْءِ الْقَضَاءِ'},
{id:'doa_39',category:'Akhlak',name:'Akhlak yang baik',arabic:'اللّٰهُمَّ اَحْسِنْ خُلُقِيْ كَمَا اَحْسَنْتَ خَلْقِيْ',latin:'Allaahumma ahsin khuluqii kamaa ahsanta khalqii',meaning:'Ya Allah, baguskan akhlakku sebagaimana Engkau membaguskan penciptaanku.',audioText:'اللّٰهُمَّ اَحْسِنْ خُلُقِيْ كَمَا اَحْسَنْتَ خَلْقِيْ'},
{id:'doa_40',category:'Akhlak',name:'Hati yang teguh',arabic:'يَا مُقَلِّبَ الْقُلُوْبِ ثَبِّتْ قَلْبِيْ عَلَى دِيْنِكَ',latin:'Yaa muqallibal quluub tsabbit qalbii ‘alaa diinika',meaning:'Wahai Dzat yang membolak-balikkan hati, teguhkan hatiku di atas agama-Mu.',audioText:'يَا مُقَلِّبَ الْقُلُوْبِ ثَبِّتْ قَلْبِيْ عَلَى دِيْنِكَ'}

 warhamhuma kama rabbayani shaghira.", "meaning": "Ya Rabb, ampunilah aku dan kedua orang tuaku, dan sayangilah mereka sebagaimana mereka menyayangiku saat kecil.", "audioText": "رَبِّ اغْفِرْ لِيْ وَلِوَالِدَيَّ وَارْحَمْهُمَا كَمَا رَبَّيَانِيْ صَغِيْرًا"}, {"id": "v17_doa_005", "category": "Ilmu", "name": "Doa sebelum belajar", "arabic": "رَبِّ زِدْنِيْ عِلْمًا وَفَهْمًا وَارْزُقْنِيْ عَمَلًا صَالِحًا", "latin": "Rabbi zidni ‘ilman wa fahman warzuqni ‘amalan shalihan.", "meaning": "Ya Rabb, tambahkan ilmu dan pemahaman kepadaku, serta karuniakan amal saleh.", "audioText": "رَبِّ زِدْنِيْ عِلْمًا وَفَهْمًا وَارْزُقْنِيْ عَمَلًا صَالِحًا"}, {"id": "v17_doa_006", "category": "Ilmu", "name": "Doa mudah memahami", "arabic": "اَللّٰهُمَّ فَقِّهْنِيْ فِي الدِّيْنِ وَعَلِّمْنِي التَّأْوِيْلَ", "latin": "Allahumma faqqihni fid din wa ‘allimnit ta-wil.", "meaning": "Ya Allah, pahamkan aku dalam agama dan ajarkan kepadaku pemahaman yang benar.", "audioText": "اَللّٰهُمَّ فَقِّهْنِيْ فِي الدِّيْنِ وَعَلِّمْنِي التَّأْوِيْلَ"}, {"id": "v17_doa_007", "category": "Hafalan", "name": "Doa agar hafalan kuat", "arabic": "اَللّٰهُمَّ ذَكِّرْنِيْ مِنْهُ مَا نُسِّيْتُ وَعَلِّمْنِيْ مِنْهُ مَا جَهِلْتُ", "latin": "Allahumma dzakkirni minhu ma nussitu wa ‘allimni minhu ma jahiltu.", "meaning": "Ya Allah, ingatkan aku terhadap yang terlupa dan ajarkan aku yang belum kuketahui.", "audioText": "اَللّٰهُمَّ ذَكِّرْنِيْ مِنْهُ مَا نُسِّيْتُ وَعَلِّمْنِيْ مِنْهُ مَا جَهِلْتُ"}, {"id": "v17_doa_008", "category": "Sholat", "name": "Doa setelah wudhu", "arabic": "أَشْهَدُ أَنْ لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ لَا شَرِيْكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُوْلُهُ", "latin": "Asyhadu an la ilaha illallah wahdahu la syarika lah, wa asyhadu anna Muhammadan ‘abduhu wa rasuluh.", "meaning": "Aku bersaksi tiada Tuhan selain Allah dan Muhammad adalah hamba serta utusan-Nya.", "audioText": "أَشْهَدُ أَنْ لَا إِلٰهَ إِلَّا اللّٰهُ وَحْدَهُ لَا شَرِيْكَ لَهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُوْلُهُ"}, {"id": "v17_doa_009", "category": "Sholat", "name": "Doa masuk masjid lengkap", "arabic": "اَللّٰهُمَّ افْتَحْ لِيْ أَبْوَابَ رَحْمَتِكَ", "latin": "Allahummaftah li abwaba rahmatik.", "meaning": "Ya Allah, bukakanlah untukku pintu-pintu rahmat-Mu.", "audioText": "اَللّٰهُمَّ افْتَحْ لِيْ أَبْوَابَ رَحْمَتِكَ"}, {"id": "v17_doa_010", "category": "Sholat", "name": "Doa keluar masjid lengkap", "arabic": "اَللّٰهُمَّ إِنِّيْ أَسْأَلُكَ مِنْ فَضْلِكَ", "latin": "Allahumma inni as-aluka min fadhlik.", "meaning": "Ya Allah, aku memohon karunia-Mu.", "audioText": "اَللّٰهُمَّ إِنِّيْ أَسْأَلُكَ مِنْ فَضْلِكَ"}, {"id": "v17_doa_011", "category": "Tidur", "name": "Doa bangun malam", "arabic": "لَا إِلٰهَ إِلَّا أَنْتَ سُبْحَانَكَ، اَللّٰهُمَّ أَسْتَغْفِرُكَ لِذَنْبِيْ وَأَسْأَلُكَ رَحْمَتَكَ", "latin": "La ilaha illa anta subhanaka, Allahumma astaghfiruka lidzanbi wa as-aluka rahmatak.", "meaning": "Tiada Tuhan selain Engkau, Mahasuci Engkau. Ya Allah, aku memohon ampun dan rahmat-Mu.", "audioText": "لَا إِلٰهَ إِلَّا أَنْتَ سُبْحَانَكَ، اَللّٰهُمَّ أَسْتَغْفِرُكَ لِذَنْبِيْ وَأَسْأَلُكَ رَحْمَتَكَ"}, {"id": "v17_doa_012", "category": "Tidur", "name": "Doa berlindung sebelum tidur", "arabic": "بِاسْمِكَ رَبِّيْ وَضَعْتُ جَنْبِيْ وَبِكَ أَرْفَعُهُ", "latin": "Bismika rabbi wadha‘tu janbi wa bika arfa‘uh.", "meaning": "Dengan nama-Mu Tuhanku aku membaringkan tubuhku dan dengan-Mu aku mengangkatnya.", "audioText": "بِاسْمِكَ رَبِّيْ وَضَعْتُ جَنْبِيْ وَبِكَ أَرْفَعُهُ"}, {"id": "v17_doa_013", "category": "Rumah", "name": "Doa masuk rumah ringkas", "arabic": "بِسْمِ اللّٰهِ وَلَجْنَا، وَبِسْمِ اللّٰهِ خَرَجْنَا، وَعَلَى رَبِّنَا تَوَكَّلْنَا", "latin": "Bismillahi walajna, wa bismillahi kharajna, wa ‘ala rabbina tawakkalna.", "meaning": "Dengan nama Allah kami masuk dan keluar, dan kepada Tuhan kami bertawakal.", "audioText": "بِسْمِ اللّٰهِ وَلَجْنَا، وَبِسْمِ اللّٰهِ خَرَجْنَا، وَعَلَى رَبِّنَا تَوَكَّلْنَا"}, {"id": "v17_doa_014", "category": "Safar", "name": "Doa naik kendaraan", "arabic": "سُبْحَانَ الَّذِيْ سَخَّرَ لَنَا هٰذَا وَمَا كُنَّا لَهُ مُقْرِنِيْنَ، وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُوْنَ", "latin": "Subhanalladzi sakhkhara lana hadza wa ma kunna lahu muqrinin, wa inna ila rabbina lamunqalibun.", "meaning": "Mahasuci Allah yang menundukkan kendaraan ini bagi kami, dan kepada Tuhan kami akan kembali.", "audioText": "سُبْحَانَ الَّذِيْ سَخَّرَ لَنَا هٰذَا وَمَا كُنَّا لَهُ مُقْرِنِيْنَ، وَإِنَّا إِلَى رَبِّنَا لَمُنْقَلِبُوْنَ"}, {"id": "v17_doa_015", "category": "Safar", "name": "Doa perjalanan", "arabic": "اَللّٰهُمَّ إِنَّا نَسْأَلُكَ فِيْ سَفَرِنَا هٰذَا الْبِرَّ وَالتَّقْوَى وَمِنَ الْعَمَلِ مَا تَرْضَى", "latin": "Allahumma inna nas-aluka fi safarina hadzal birra wat taqwa wa minal ‘amali ma tardha.", "meaning": "Ya Allah, kami memohon dalam perjalanan ini kebaikan, takwa, dan amal yang Engkau ridhai.", "audioText": "اَللّٰهُمَّ إِنَّا نَسْأَلُكَ فِيْ سَفَرِنَا هٰذَا الْبِرَّ وَالتَّقْوَى وَمِنَ الْعَمَلِ مَا تَرْضَى"}, {"id": "v17_doa_016", "category": "Sakit", "name": "Doa menjenguk orang sakit", "arabic": "لَا بَأْسَ طَهُوْرٌ إِنْ شَاءَ اللّٰهُ", "latin": "La ba-sa thahurun in sya Allah.", "meaning": "Tidak mengapa, semoga menjadi penyuci dosa dengan izin Allah.", "audioText": "لَا بَأْسَ طَهُوْرٌ إِنْ شَاءَ اللّٰهُ"}, {"id": "v17_doa_017", "category": "Sakit", "name": "Doa meminta kesembuhan", "arabic": "اَللّٰهُمَّ رَبَّ النَّاسِ أَذْهِبِ الْبَأْسَ، اشْفِ أَنْتَ الشَّافِيْ", "latin": "Allahumma rabbannas adzhibil ba-sa, isyfi antasy syafi.", "meaning": "Ya Allah Tuhan manusia, hilangkanlah penyakit dan sembuhkanlah, Engkaulah Maha Penyembuh.", "audioText": "اَللّٰهُمَّ رَبَّ النَّاسِ أَذْهِبِ الْبَأْسَ، اشْفِ أَنْتَ الشَّافِيْ"}, {"id": "v17_doa_018", "category": "Rezeki", "name": "Doa rezeki halal", "arabic": "اَللّٰهُمَّ اكْفِنِيْ بِحَلَالِكَ عَنْ حَرَامِكَ وَأَغْنِنِيْ بِفَضْلِكَ عَمَّنْ سِوَاكَ", "latin": "Allahummakfini bihalalika ‘an haramika wa aghnini bifadhlika ‘amman siwak.", "meaning": "Ya Allah, cukupkan aku dengan yang halal dari yang haram, dan kayakan aku dengan karunia-Mu.", "audioText": "اَللّٰهُمَّ اكْفِنِيْ بِحَلَالِكَ عَنْ حَرَامِكَ وَأَغْنِنِيْ بِفَضْلِكَ عَمَّنْ سِوَاكَ"}, {"id": "v17_doa_019", "category": "Akhlak", "name": "Doa akhlak baik", "arabic": "اَللّٰهُمَّ كَمَا حَسَّنْتَ خَلْقِيْ فَحَسِّنْ خُلُقِيْ", "latin": "Allahumma kama hassanta khalqi fahassin khuluqi.", "meaning": "Ya Allah, sebagaimana Engkau baguskan rupaku, baguskan pula akhlakku.", "audioText": "اَللّٰهُمَّ كَمَا حَسَّنْتَ خَلْقِيْ فَحَسِّنْ خُلُقِيْ"}, {"id": "v17_doa_020", "category": "Akhlak", "name": "Doa perlindungan dari malas", "arabic": "اَللّٰهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ", "latin": "Allahumma inni a‘udzu bika minal ‘ajzi wal kasal.", "meaning": "Ya Allah, aku berlindung kepada-Mu dari kelemahan dan kemalasan.", "audioText": "اَللّٰهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ"}, {"id": "v17_doa_021", "category": "Quran", "name": "Doa sebelum membaca Quran", "arabic": "اَللّٰهُمَّ اجْعَلِ الْقُرْآنَ رَبِيْعَ قَلْبِيْ وَنُوْرَ صَدْرِيْ", "latin": "Allahummaj‘alil Qur-ana rabi‘a qalbi wa nura shadri.", "meaning": "Ya Allah, jadikan Al-Quran penyejuk hatiku dan cahaya dadaku.", "audioText": "اَللّٰهُمَّ اجْعَلِ الْقُرْآنَ رَبِيْعَ قَلْبِيْ وَنُوْرَ صَدْرِيْ"}, {"id": "v17_doa_022", "category": "Quran", "name": "Doa setelah membaca Quran", "arabic": "اَللّٰهُمَّ ارْحَمْنِيْ بِالْقُرْآنِ وَاجْعَلْهُ لِيْ إِمَامًا وَنُوْرًا وَهُدًى وَرَحْمَةً", "latin": "Allahummarhamni bil Qur-an waj‘alhu li imaman wa nuran wa hudan wa rahmah.", "meaning": "Ya Allah, rahmatilah aku dengan Al-Quran dan jadikan ia imam, cahaya, petunjuk, dan rahmat bagiku.", "audioText": "اَللّٰهُمَّ ارْحَمْنِيْ بِالْقُرْآنِ وَاجْعَلْهُ لِيْ إِمَامًا وَنُوْرًا وَهُدًى وَرَحْمَةً"}, {"id": "v17_doa_023", "category": "Taubat", "name": "Istighfar ringkas", "arabic": "أَسْتَغْفِرُ اللّٰهَ الْعَظِيْمَ وَأَتُوْبُ إِلَيْهِ", "latin": "Astaghfirullahal ‘azhim wa atubu ilaih.", "meaning": "Aku memohon ampun kepada Allah Yang Mahaagung dan bertobat kepada-Nya.", "audioText": "أَسْتَغْفِرُ اللّٰهَ الْعَظِيْمَ وَأَتُوْبُ إِلَيْهِ"}, {"id": "v17_doa_024", "category": "Taubat", "name": "Doa Nabi Yunus", "arabic": "لَا إِلٰهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّيْ كُنْتُ مِنَ الظَّالِمِيْنَ", "latin": "La ilaha illa anta subhanaka inni kuntu minazh zhalimin.", "meaning": "Tiada Tuhan selain Engkau. Mahasuci Engkau, sungguh aku termasuk orang yang zalim.", "audioText": "لَا إِلٰهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّيْ كُنْتُ مِنَ الظَّالِمِيْنَ"}, {"id": "v17_doa_025", "category": "Keluarga", "name": "Doa keluarga sakinah", "arabic": "رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِيْنَ إِمَامًا", "latin": "Rabbana hab lana min azwajina wa dzurriyyatina qurrata a‘yun waj‘alna lil muttaqina imama.", "meaning": "Ya Tuhan kami, anugerahkan kepada kami pasangan dan keturunan sebagai penyejuk mata.", "audioText": "رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِيْنَ إِمَامًا"}, {"id": "v17_doa_026", "category": "Keluarga", "name": "Doa anak saleh", "arabic": "رَبِّ هَبْ لِيْ مِنَ الصَّالِحِيْنَ", "latin": "Rabbi hab li minash shalihin.", "meaning": "Ya Rabb, anugerahkan kepadaku keturunan yang saleh.", "audioText": "رَبِّ هَبْ لِيْ مِنَ الصَّالِحِيْنَ"}, {"id": "v17_doa_027", "category": "Kesulitan", "name": "Doa ketika sulit", "arabic": "اَللّٰهُمَّ لَا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا وَأَنْتَ تَجْعَلُ الْحَزْنَ إِذَا شِئْتَ سَهْلًا", "latin": "Allahumma la sahla illa ma ja‘altahu sahla, wa anta taj‘alul hazna idza syi-ta sahla.", "meaning": "Ya Allah, tidak ada yang mudah kecuali yang Engkau mudahkan.", "audioText": "اَللّٰهُمَّ لَا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا وَأَنْتَ تَجْعَلُ الْحَزْنَ إِذَا شِئْتَ سَهْلًا"}, {"id": "v17_doa_028", "category": "Kesulitan", "name": "Doa lapang dada", "arabic": "رَبِّ اشْرَحْ لِيْ صَدْرِيْ، وَيَسِّرْ لِيْ أَمْرِيْ", "latin": "Rabbisyrah li shadri, wa yassir li amri.", "meaning": "Ya Rabb, lapangkan dadaku dan mudahkan urusanku.", "audioText": "رَبِّ اشْرَحْ لِيْ صَدْرِيْ، وَيَسِّرْ لِيْ أَمْرِيْ"}, {"id": "v17_doa_029", "category": "Hujan", "name": "Doa ketika turun hujan", "arabic": "اَللّٰهُمَّ صَيِّبًا نَافِعًا", "latin": "Allahumma shayyiban nafi‘a.", "meaning": "Ya Allah, jadikan hujan ini bermanfaat.", "audioText": "اَللّٰهُمَّ صَيِّبًا نَافِعًا"}, {"id": "v17_doa_030", "category": "Hujan", "name": "Doa setelah hujan", "arabic": "مُطِرْنَا بِفَضْلِ اللّٰهِ وَرَحْمَتِهِ", "latin": "Muthirna bifadhlillahi wa rahmatih.", "meaning": "Kami diberi hujan karena karunia dan rahmat Allah.", "audioText": "مُطِرْنَا بِفَضْلِ اللّٰهِ وَرَحْمَتِهِ"}];
  const EXTRA_HADITH=[{"id": "v17_hadith_001", "category": "Niat", "name": "Niat", "arabic": "إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ", "latin": "HR. Bukhari & Muslim", "meaning": "Sesungguhnya amal itu tergantung niatnya.", "source": "HR. Bukhari & Muslim", "audioText": "إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ"}, {"id": "v17_hadith_002", "category": "Akhlak", "name": "Akhlak", "arabic": "الْمُسْلِمُ مَنْ سَلِمَ الْمُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِ", "latin": "HR. Bukhari & Muslim", "meaning": "Muslim yang baik adalah yang kaum muslimin selamat dari lisan dan tangannya.", "source": "HR. Bukhari & Muslim", "audioText": "الْمُسْلِمُ مَنْ سَلِمَ الْمُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِ"}, {"id": "v17_hadith_003", "category": "Ilmu", "name": "Ilmu", "arabic": "مَنْ يُرِدِ اللّٰهُ بِهِ خَيْرًا يُفَقِّهْهُ فِي الدِّينِ", "latin": "HR. Bukhari & Muslim", "meaning": "Barang siapa dikehendaki kebaikan oleh Allah, ia dipahamkan dalam agama.", "source": "HR. Bukhari & Muslim", "audioText": "مَنْ يُرِدِ اللّٰهُ بِهِ خَيْرًا يُفَقِّهْهُ فِي الدِّينِ"}, {"id": "v17_hadith_004", "category": "Quran", "name": "Quran", "arabic": "خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ", "latin": "HR. Bukhari", "meaning": "Sebaik-baik kalian adalah yang belajar Al-Quran dan mengajarkannya.", "source": "HR. Bukhari", "audioText": "خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ"}, {"id": "v17_hadith_005", "category": "Dzikir", "name": "Dzikir", "arabic": "كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ ثَقِيلَتَانِ فِي الْمِيزَانِ", "latin": "HR. Bukhari & Muslim", "meaning": "Dua kalimat ringan di lisan namun berat di timbangan.", "source": "HR. Bukhari & Muslim", "audioText": "كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ ثَقِيلَتَانِ فِي الْمِيزَانِ"}, {"id": "v17_hadith_006", "category": "Sholat", "name": "Sholat", "arabic": "صَلُّوا كَمَا رَأَيْتُمُونِي أُصَلِّي", "latin": "HR. Bukhari", "meaning": "Sholatlah kalian sebagaimana kalian melihat aku sholat.", "source": "HR. Bukhari", "audioText": "صَلُّوا كَمَا رَأَيْتُمُونِي أُصَلِّي"}, {"id": "v17_hadith_007", "category": "Kasih Sayang", "name": "Kasih Sayang", "arabic": "مَنْ لَا يَرْحَمْ لَا يُرْحَمْ", "latin": "HR. Bukhari & Muslim", "meaning": "Barang siapa tidak menyayangi, ia tidak disayangi.", "source": "HR. Bukhari & Muslim", "audioText": "مَنْ لَا يَرْحَمْ لَا يُرْحَمْ"}, {"id": "v17_hadith_008", "category": "Kejujuran", "name": "Kejujuran", "arabic": "عَلَيْكُمْ بِالصِّدْقِ فَإِنَّ الصِّدْقَ يَهْدِي إِلَى الْبِرِّ", "latin": "HR. Bukhari & Muslim", "meaning": "Hendaklah kalian jujur, karena kejujuran mengantarkan kepada kebaikan.", "source": "HR. Bukhari & Muslim", "audioText": "عَلَيْكُمْ بِالصِّدْقِ فَإِنَّ الصِّدْقَ يَهْدِي إِلَى الْبِرِّ"}, {"id": "v17_hadith_009", "category": "Adab", "name": "Adab", "arabic": "مِنْ حُسْنِ إِسْلَامِ الْمَرْءِ تَرْكُهُ مَا لَا يَعْنِيهِ", "latin": "HR. Tirmidzi", "meaning": "Di antara baiknya Islam seseorang adalah meninggalkan hal yang tidak bermanfaat baginya.", "source": "HR. Tirmidzi", "audioText": "مِنْ حُسْنِ إِسْلَامِ الْمَرْءِ تَرْكُهُ مَا لَا يَعْنِيهِ"}, {"id": "v17_hadith_010", "category": "Kebersihan", "name": "Kebersihan", "arabic": "الطُّهُورُ شَطْرُ الْإِيمَانِ", "latin": "HR. Muslim", "meaning": "Bersuci adalah bagian dari iman.", "source": "HR. Muslim", "audioText": "الطُّهُورُ شَطْرُ الْإِيمَانِ"}];

 akhir kata.", "audioText": "الْفَلَقْ، أَحَدْ Pantulan lebih kuat saat berhenti pada huruf qalqalah."}, {"id": "v17_materi_014", "category": "Waqaf", "name": "Tanda Waqaf Mim", "arabic": "م", "latin": "Berhenti wajib/lebih utama pada tanda م.", "meaning": "Agar makna ayat tidak rusak.", "audioText": "م Berhenti wajib/lebih utama pada tanda م."}, {"id": "v17_materi_015", "category": "Waqaf", "name": "Tanda La Washal", "arabic": "لا", "latin": "Jangan berhenti pada tanda لا jika belum darurat.", "meaning": "Lanjutkan bacaan agar makna tetap utuh.", "audioText": "لا Jangan berhenti pada tanda لا jika belum darurat."}, {"id": "v17_materi_016", "category": "Adab", "name": "Adab Membaca Quran", "arabic": "أَعُوذُ بِاللّٰهِ مِنَ الشَّيْطَانِ الرَّجِيمِ", "latin": "Berwudhu, bersih, menghadap baik, membaca isti‘adzah, dan tartil.", "meaning": "Membentuk kebiasaan membaca Quran dengan hormat.", "audioText": "أَعُوذُ بِاللّٰهِ مِنَ الشَّيْطَانِ الرَّجِيمِ Berwudhu, bersih, menghadap baik, membaca isti‘adzah, dan tartil."}, {"id": "v17_materi_017", "category": "Hafalan", "name": "Teknik 3-3-3", "arabic": "", "latin": "Dengar 3 kali, baca 3 kali, ulang tanpa melihat 3 kali.", "meaning": "Metode sederhana untuk hafalan surat dan doa.", "audioText": "Dengar 3 kali, baca 3 kali, ulang tanpa melihat 3 kali."}, {"id": "v17_materi_018", "category": "Evaluasi", "name": "Rekam dan Bandingkan", "arabic": "", "latin": "Rekam suara sendiri lalu bandingkan dengan qari/guru.", "meaning": "Membantu menemukan kesalahan panjang, dengung, dan makhraj.", "audioText": "Rekam suara sendiri lalu bandingkan dengan qari/guru."}, {"id": "v17_materi_019", "category": "Sholat", "name": "Tuma’ninah", "arabic": "", "latin": "Diam sejenak di setiap gerakan utama sholat.", "meaning": "Jangan terburu-buru dalam ruku, i‘tidal, sujud, dan duduk.", "audioText": "Diam sejenak di setiap gerakan utama sholat."}, {"id": "v17_materi_020", "category": "Sholat", "name": "Urutan Bacaan Sholat", "arabic": "اللّٰهُ أَكْبَر", "latin": "Takbir, doa iftitah, Al-Fatihah, surat, ruku, i‘tidal, sujud, duduk, tasyahud, salam.", "meaning": "Panduan ringkas agar tidak ada bacaan yang terlewat.", "audioText": "اللّٰهُ أَكْبَر Takbir, doa iftitah, Al-Fatihah, surat, ruku, i‘tidal, sujud, duduk, tasyahud, salam."}];
  function norm(s){return String(s||'').replace(/[ً-ٰٟ]/g,'').replace(/\s+/g,' ').trim().toLowerCase();}
  function addUnique(target,items){
    if(!window.learning) return;
    learning[target]=learning[target]||[];
    const seen=new Set(learning[target].map(x=>x.id+'|'+norm(x.name)+'|'+norm(x.arabic)));
    items.forEach((x,i)=>{
      x.audioText=x.audioText||x.arabic||x.latin||x.meaning||x.name;
      const key=x.id+'|'+norm(x.name)+'|'+norm(x.arabic);
      const alt=norm(x.name)+'|'+norm(x.arabic);
      const exists=learning[target].some(y=>norm(y.name)+'|'+norm(y.arabic)===alt || y.id===x.id);
      if(!seen.has(key) && !exists){learning[target].push(x);seen.add(key);}
    });
  }
  function cleanModule(target){
    if(!window.learning||!learning[target]) return 0;
    const before=learning[target].length, out=[], seen=new Set();
    learning[target].forEach(x=>{
      x.audioText=x.audioText||x.arabic||x.latin||x.meaning||x.name||'';
      const key=norm(x.name)+'|'+norm(x.arabic)+'|'+norm(x.meaning);
      if(!seen.has(key)){seen.add(key);out.push(x);}
    });
    learning[target]=out;
    return before-out.length;
  }
  addUnique('doa',EXTRA_DUAS);
  addUnique('materi',EXTRA_MATERI);
  addUnique('hadithLocal',EXTRA_HADITH);
  ['hijaiyah','iqro','tajwid','sholat','doa','materi','hadithLocal'].forEach(cleanModule);
  if(window.menus && !menus.some(m=>m[0]==='materi')) menus.splice(6,0,['materi','📘 Materi Lengkap']);
  
  window.getAudioAudit=function(){
    const keys=['hijaiyah','iqro','tajwid','sholat','doa','materi','hadithLocal'];
    let total=0,missing=0,dupes=0;
    keys.forEach(k=>{
      const arr=learning[k]||[]; total+=arr.length;
      const s=new Set();
      arr.forEach(x=>{if(!(x.audioText||x.arabic||x.meaning||x.latin)) missing++; const key=norm(x.name)+'|'+norm(x.arabic); if(s.has(key)) dupes++; s.add(key);});
    });
    return {total,missing,dupes,doa:(learning.doa||[]).length,materi:(learning.materi||[]).length,hadith:(learning.hadithLocal||[]).length};
  };
  const oldSpeak=window.speak;
  window.speak=function(text,label){
    text=String(text||'').replace(/\s+/g,' ').trim();
    if(!text){toast&&toast('Audio belum tersedia untuk item ini');return;}
    last={type:'tts',text,label}; setNow&&setNow(label||'Audio');
    const mp3=document.getElementById('mp3'); if(mp3) mp3.pause();
    if(!('speechSynthesis' in window)){toast&&toast('Browser tidak mendukung TTS');return;}
    speechSynthesis.cancel();
    const isArabic=/[اأإآء-ي]/.test(text);
    let u=new SpeechSynthesisUtterance(text);
    u.lang=isArabic?'ar-SA':'id-ID';
    const rateEl=document.getElementById('rate'); u.rate=rateEl?+rateEl.value:(isArabic?.82:1);
    const voiceEl=document.getElementById('voice');
    let chosen=null;
    if(isArabic) chosen=(voices||[]).find(v=>/ar|arab/i.test(v.lang+' '+v.name));
    if(!chosen && !isArabic) chosen=(voices||[]).find(v=>/id|indonesia/i.test(v.lang+' '+v.name));
    if(!chosen && voiceEl) chosen=(voices||[]).find(v=>v.name===voiceEl.value);
    if(chosen) u.voice=chosen;
    speechSynthesis.speak(u);
  };
  window.playLearning=function(x){ if(x.audioUrl){playUrl(x.audioUrl,x.name||x.level||x.id)} else {speak(x.audioText||x.arabic||x.latin||x.meaning,x.name||x.level||x.id)} mark&&mark(x.id); };

": "v18_dua_016", "category": "Doa Harian v18", "name": "Doa Nabi Yunus", "arabic": "لَا إِلٰهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ", "latin": "La ilaha illa anta subhanaka inni kuntu minazh-zhalimin", "meaning": "Tidak ada Tuhan selain Engkau, Maha Suci Engkau, sungguh aku termasuk orang zalim.", "audioText": "لَا إِلٰهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ"}, {"id": "v18_dua_017", "category": "Doa Harian v18", "name": "Memohon rezeki baik", "arabic": "اللّٰهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا وَرِزْقًا طَيِّبًا وَعَمَلًا مُتَقَبَّلًا", "latin": "Allahumma inni as-aluka ‘ilman nafi’an wa rizqan thayyiban wa ‘amalan mutaqabbala", "meaning": "Ya Allah, aku memohon ilmu bermanfaat, rezeki baik, dan amal yang diterima.", "audioText": "اللّٰهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا وَرِزْقًا طَيِّبًا وَعَمَلًا مُتَقَبَّلًا"}, {"id": "v18_dua_018", "category": "Doa Harian v18", "name": "Doa ketika hujan", "arabic": "اللّٰهُمَّ صَيِّبًا نَافِعًا", "latin": "Allahumma shayyiban nafi’a", "meaning": "Ya Allah, jadikan hujan ini bermanfaat.", "audioText": "اللّٰهُمَّ صَيِّبًا نَافِعًا"}, {"id": "v18_dua_019", "category": "Doa Harian v18", "name": "Doa setelah hujan", "arabic": "مُطِرْنَا بِفَضْلِ اللّٰهِ وَرَحْمَتِهِ", "latin": "Muthirna bifadhlillahi wa rahmatih", "meaning": "Kami diberi hujan karena karunia dan rahmat Allah.", "audioText": "مُطِرْنَا بِفَضْلِ اللّٰهِ وَرَحْمَتِهِ"}, {"id": "v18_dua_020", "category": "Doa Harian v18", "name": "Doa bercermin", "arabic": "اللّٰهُمَّ كَمَا حَسَّنْتَ خَلْقِي فَحَسِّنْ خُلُقِي", "latin": "Allahumma kama hassanta khalqi fahassin khuluqi", "meaning": "Ya Allah, sebagaimana Engkau memperindah rupaku, perindahlah akhlakku.", "audioText": "اللّٰهُمَّ كَمَا حَسَّنْتَ خَلْقِي فَحَسِّنْ خُلُقِي"}, {"id": "v18_dua_021", "category": "Doa Harian v18", "name": "Memohon petunjuk", "arabic": "اللّٰهُمَّ اهْدِنِي وَسَدِّدْنِي", "latin": "Allahummahdini wa saddidni", "meaning": "Ya Allah, berilah aku petunjuk dan luruskan aku.", "audioText": "اللّٰهُمَّ اهْدِنِي وَسَدِّدْنِي"}, {"id": "v18_dua_022", "category": "Doa Harian v18", "name": "Berlindung dari ilmu tak bermanfaat", "arabic": "اللّٰهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عِلْمٍ لَا يَنْفَعُ", "latin": "Allahumma inni a’udzu bika min ‘ilmin la yanfa’", "meaning": "Ya Allah, aku berlindung dari ilmu yang tidak bermanfaat.", "audioText": "اللّٰهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عِلْمٍ لَا يَنْفَعُ"}, {"id": "v18_dua_023", "category": "Doa Harian v18", "name": "Doa masuk masjid", "arabic": "اللّٰهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ", "latin": "Allahummaftah li abwaba rahmatik", "meaning": "Ya Allah, bukakan untukku pintu-pintu rahmat-Mu.", "audioText": "اللّٰهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ"}, {"id": "v18_dua_024", "category": "Doa Harian v18", "name": "Doa keluar masjid", "arabic": "اللّٰهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ", "latin": "Allahumma inni as-aluka min fadhlik", "meaning": "Ya Allah, aku memohon karunia-Mu.", "audioText": "اللّٰهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ"}, {"id": "v18_dua_025", "category": "Doa Harian v18", "name": "Doa menjenguk orang sakit", "arabic": "لَا بَأْسَ طَهُورٌ إِنْ شَاءَ اللّٰهُ", "latin": "La ba’sa thahurun insya Allah", "meaning": "Tidak mengapa, semoga menjadi pembersih dosa insya Allah.", "audioText": "لَا بَأْسَ طَهُورٌ إِنْ شَاءَ اللّٰهُ"}, {"id": "v18_dua_026", "category": "Doa Harian v18", "name": "Doa untuk pengantin", "arabic": "بَارَكَ اللّٰهُ لَكَ وَبَارَكَ عَلَيْكَ وَجَمَعَ بَيْنَكُمَا فِي خَيْرٍ", "latin": "Barakallahu laka wa baraka ‘alaika wa jama’a bainakuma fi khair", "meaning": "Semoga Allah memberkahimu, melimpahkan berkah atasmu, dan menyatukan kalian dalam kebaikan.", "audioText": "بَارَكَ اللّٰهُ لَكَ وَبَارَكَ عَلَيْكَ وَجَمَعَ بَيْنَكُمَا فِي خَيْرٍ"}, {"id": "v18_dua_027", "category": "Doa Harian v18", "name": "Doa ketika marah", "arabic": "أَعُوذُ بِاللّٰهِ مِنَ الشَّيْطَانِ الرَّجِيمِ", "latin": "A’udzu billahi minasy-syaithanir-rajim", "meaning": "Aku berlindung kepada Allah dari setan yang terkutuk.", "audioText": "أَعُوذُ بِاللّٰهِ مِنَ الشَّيْطَانِ الرَّجِيمِ"}, {"id": "v18_dua_028", "category": "Doa Harian v18", "name": "Tasbih", "arabic": "سُبْحَانَ اللّٰهِ", "latin": "Subhanallah", "meaning": "Maha Suci Allah.", "audioText": "سُبْحَانَ اللّٰهِ"}, {"id": "v18_dua_029", "category": "Doa Harian v18", "name": "Tahmid", "arabic": "الحَمْدُ لِلّٰهِ", "latin": "Alhamdulillah", "meaning": "Segala puji bagi Allah.", "audioText": "الحَمْدُ لِلّٰهِ"}, {"id": "v18_dua_030", "category": "Doa Harian v18", "name": "Takbir", "arabic": "اللّٰهُ أَكْبَرُ", "latin": "Allahu akbar", "meaning": "Allah Maha Besar.", "audioText": "اللّٰهُ أَكْبَرُ"}, {"id": "v18_dua_031", "category": "Doa Harian v18", "name": "Tahlil", "arabic": "لَا إِلٰهَ إِلَّا اللّٰهُ", "latin": "La ilaha illallah", "meaning": "Tidak ada Tuhan selain Allah.", "audioText": "لَا إِلٰهَ إِلَّا اللّٰهُ"}, {"id": "v18_dua_032", "category": "Doa Harian v18", "name": "Istighfar", "arabic": "أَسْتَغْفِرُ اللّٰهَ", "latin": "Astaghfirullah", "meaning": "Aku memohon ampun kepada Allah.", "audioText": "أَسْتَغْفِرُ اللّٰهَ"}, {"id": "v18_dua_033", "category": "Doa Harian v18", "name": "Shalawat ringkas", "arabic": "اللّٰهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ", "latin": "Allahumma shalli ‘ala Muhammad", "meaning": "Ya Allah, limpahkan shalawat kepada Nabi Muhammad.", "audioText": "اللّٰهُمَّ صَلِّ عَلَىٰ مُحَمَّدٍ"}, {"id": "v18_dua_034", "category": "Doa Harian v18", "name": "Memohon surga", "arabic": "اللّٰهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ", "latin": "Allahumma inni as-alukal-jannah", "meaning": "Ya Allah, aku memohon surga kepada-Mu.", "audioText": "اللّٰهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ"}, {"id": "v18_dua_035", "category": "Doa Harian v18", "name": "Berlindung dari neraka", "arabic": "اللّٰهُمَّ أَجِرْنِي مِنَ النَّارِ", "latin": "Allahumma ajirni minan-nar", "meaning": "Ya Allah, lindungilah aku dari neraka.", "audioText": "اللّٰهُمَّ أَجِرْنِي مِنَ النَّارِ"}, {"id": "v18_dua_036", "category": "Doa Harian v18", "name": "Doa sebelum belajar", "arabic": "رَبِّ زِدْنِي عِلْمًا وَارْزُقْنِي فَهْمًا", "latin": "Rabbi zidni ‘ilma warzuqni fahma", "meaning": "Ya Tuhanku, tambahkan ilmu dan berikan pemahaman.", "audioText": "رَبِّ زِدْنِي عِلْمًا وَارْزُقْنِي فَهْمًا"}, {"id": "v18_dua_037", "category": "Doa Harian v18", "name": "Doa kelancaran lisan", "arabic": "وَاحْلُلْ عُقْدَةً مِنْ لِسَانِي يَفْقَهُوا قَوْلِي", "latin": "Wahlul ‘uqdatan min lisani yafqahu qauli", "meaning": "Lepaskan kekakuan lisanku agar mereka memahami perkataanku.", "audioText": "وَاحْلُلْ عُقْدَةً مِنْ لِسَانِي يَفْقَهُوا قَوْلِي"}, {"id": "v18_dua_038", "category": "Doa Harian v18", "name": "Memohon perlindungan keluarga", "arabic": "رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِنْ ذُرِّيَّتِي", "latin": "Rabbij’alni muqimash-shalati wa min dzurriyyati", "meaning": "Ya Tuhanku, jadikan aku dan keturunanku orang yang mendirikan sholat.", "audioText": "رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِنْ ذُرِّيَّتِي"}, {"id": "v18_dua_039", "category": "Doa Harian v18", "name": "Doa ampunan luas", "arabic": "رَبَّنَا اغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِي أَمْرِنَا", "latin": "Rabbana-ghfir lana dzunubana wa israfana fi amrina", "meaning": "Ya Tuhan kami, ampunilah dosa-dosa kami dan sikap berlebihan kami.", "audioText": "رَبَّنَا اغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِي أَمْرِنَا"}, {"id": "v18_dua_040", "category": "Doa Harian v18", "name": "Doa husnul khatimah", "arabic": "اللّٰهُمَّ أَحْسِنْ عَاقِبَتَنَا فِي الْأُمُورِ كُلِّهَا", "latin": "Allahumma ahsin ‘aqibatana fil-umuri kulliha", "meaning": "Ya Allah, baikkan akhir semua urusan kami.", "audioText": "اللّٰهُمَّ أَحْسِنْ عَاقِبَتَنَا فِي الْأُمُورِ كُلِّهَا"}];
  const EXTRA_HADITH=[{"id": "v18_hadith_001", "category": "Bukhari-Muslim", "name": "Niat", "arabic": "إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ", "latin": "Bukhari-Muslim", "meaning": "Sesungguhnya amal itu tergantung niatnya.", "audioText": "إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ"}, {"id": "v18_hadith_002", "category": "Bukhari", "name": "Mudahnya agama", "arabic": "إِنَّ الدِّينَ يُسْرٌ", "latin": "Bukhari", "meaning": "Sesungguhnya agama itu mudah.", "audioText": "إِنَّ الدِّينَ يُسْرٌ"}, {"id": "v18_hadith_003", "category": "Bukhari-Muslim", "name": "Malu", "arabic": "الْحَيَاءُ شُعْبَةٌ مِنَ الْإِيمَانِ", "latin": "Bukhari-Muslim", "meaning": "Malu adalah salah satu cabang iman.", "audioText": "الْحَيَاءُ شُعْبَةٌ مِنَ الْإِيمَانِ"}, {"id": "v18_hadith_004", "category": "Tirmidzi", "name": "Senyum", "arabic": "تَبَسُّمُكَ فِي وَجْهِ أَخِيكَ صَدَقَةٌ", "latin": "Tirmidzi", "meaning": "Senyummu di hadapan saudaramu adalah sedekah.", "audioText": "تَبَسُّمُكَ فِي وَجْهِ أَخِيكَ صَدَقَةٌ"}, {"id": "v18_hadith_005", "category": "Muslim", "name": "Kebersihan", "arabic": "الطُّهُورُ شَطْرُ الْإِيمَانِ", "latin": "Muslim", "meaning": "Bersuci adalah sebagian dari iman.", "audioText": "الطُّهُورُ شَطْرُ الْإِيمَانِ"}, {"id": "v18_hadith_006", "category": "Bukhari", "name": "Tidak marah", "arabic": "لَا تَغْضَبْ", "latin": "Bukhari", "meaning": "Jangan marah.", "audioText": "لَا تَغْضَبْ"}, {"id": "v18_hadith_007", "category": "Bukhari-Muslim", "name": "Kasih sayang", "arabic": "مَنْ لَا يَرْحَمْ لَا يُرْحَمْ", "latin": "Bukhari-Muslim", "meaning": "Siapa yang tidak menyayangi, tidak akan disayangi.", "audioText": "مَنْ لَا يَرْحَمْ لَا يُرْحَمْ"}, {"id": "v18_hadith_008", "category": "Bukhari-Muslim", "name": "Ucapan baik", "arabic": "فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ", "latin": "Bukhari-Muslim", "meaning": "Hendaklah berkata baik atau diam.", "audioText": "فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ"}, {"id": "v18_hadith_009", "category": "Bukhari-Muslim", "name": "Muslim sejati", "arabic": "الْمُسْلِمُ مَنْ سَلِمَ الْمُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِ", "latin": "Bukhari-Muslim", "meaning": "Muslim sejati adalah yang kaum muslimin selamat dari lisan dan tangannya.", "audioText": "الْمُسْلِمُ مَنْ سَلِمَ الْمُسْلِمُونَ مِنْ لِسَانِهِ وَيَدِهِ"}, {"id": "v18_hadith_010", "category": "Bukhari-Muslim", "name": "Mencintai saudara", "arabic": "لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ", "latin": "Bukhari-Muslim", "meaning": "Tidak sempurna iman seseorang sampai ia mencintai saudaranya seperti mencintai dirinya.", "audioText": "لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ مَا يُحِبُّ لِنَفْسِهِ"}, {"id": "v18_hadith_011", "category": "Muslim", "name": "Menuntut ilmu", "arabic": "مَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللّٰهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ", "latin": "Muslim", "meaning": "Siapa menempuh jalan mencari ilmu, Allah mudahkan jalannya menuju surga.", "audioText": "مَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا سَهَّلَ اللّٰهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ"}, {"id": "v18_hadith_012", "category": "Bukhari", "name": "Al-Quran", "arabic": "خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ", "latin": "Bukhari", "meaning": "Sebaik-baik kalian adalah yang belajar Al-Quran dan mengajarkannya.", "audioText": "خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ"}, {"id": "v18_hadith_013", "category": "Bukhari-Muslim", "name": "Dzikir", "arabic": "كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ ثَقِيلَتَانِ فِي الْمِيزَانِ", "latin": "Bukhari-Muslim", "meaning": "Dua kalimat ringan di lisan tetapi berat di timbangan.", "audioText": "كَلِمَتَانِ خَفِيفَتَانِ عَلَى اللِّسَانِ ثَقِيلَتَانِ فِي الْمِيزَانِ"}, {"id": "v18_hadith_014", "category": "Bukhari-Muslim", "name": "Jujur", "arabic": "عَلَيْكُمْ بِالصِّدْقِ", "latin": "Bukhari-Muslim", "meaning": "Hendaklah kalian berlaku jujur.", "audioText": "عَلَيْكُمْ بِالصِّدْقِ"}, {"id": "v18_hadith_015", "category": "Tirmidzi", "name": "Doa", "arabic": "الدُّ b.", "audioText": "Niat, wajah, tangan, kepala, kaki, tertib."}, {"id": "v18_materi_031", "category": "Hafalan praktis", "name": "Doa Harian", "arabic": "بِسْمِ اللّٰهِ", "latin": "Doa Harian", "meaning": "Mulai dari doa makan, tidur, rumah, masjid, dan belajar.", "audioText": "بِسْمِ اللّٰهِ Mulai dari doa makan, tidur, rumah, masjid, dan belajar."}, {"id": "v18_materi_032", "category": "Metode ayat kecil", "name": "Hafalan Surat Pendek", "arabic": "", "latin": "Hafalan Surat Pendek", "meaning": "Dengar ayat, baca pelan, tutup teks, lalu ulang.", "audioText": "Dengar ayat, baca pelan, tutup teks, lalu ulang."}, {"id": "v18_materi_033", "category": "Pelan dan jelas", "name": "Tartil", "arabic": "وَرَتِّلِ الْقُرْآنَ", "latin": "Tartil", "meaning": "Baca tenang, tidak tergesa, setiap huruf diberi hak.", "audioText": "وَرَتِّلِ الْقُرْآنَ Baca tenang, tidak tergesa, setiap huruf diberi hak."}, {"id": "v18_materi_034", "category": "Latihan mandiri", "name": "Tahsin Mandiri", "arabic": "", "latin": "Tahsin Mandiri", "meaning": "Gunakan rekaman diri, catat kesalahan, ulang bagian sulit.", "audioText": "Gunakan rekaman diri, catat kesalahan, ulang bagian sulit."}, {"id": "v18_materi_035", "category": "Ra tafkhim/tarqiq", "name": "Tebal Tipis Ra", "arabic": "رَ رِ رُ", "latin": "Tebal Tipis Ra", "meaning": "Ra dapat tebal atau tipis tergantung harakat dan konteks.", "audioText": "رَ رِ رُ Ra dapat tebal atau tipis tergantung harakat dan konteks."}, {"id": "v18_materi_036", "category": "Allah tebal/tipis", "name": "Lam Jalalah", "arabic": "اللّٰه", "latin": "Lam Jalalah", "meaning": "Lam pada lafaz Allah tebal setelah fathah/dhammah, tipis setelah kasrah.", "audioText": "اللّٰه Lam pada lafaz Allah tebal setelah fathah/dhammah, tipis setelah kasrah."}, {"id": "v18_materi_037", "category": "Bedakan tenggorokan", "name": "Hamzah dan Ain", "arabic": "أ ع", "latin": "Hamzah dan Ain", "meaning": "Hamzah tajam dari pangkal, ain dari tengah tenggorokan.", "audioText": "أ ع Hamzah   const css=`
  .guardianHero{border:1px solid rgba(255,209,102,.48);background:radial-gradient(circle at 15% 10%,rgba(255,209,102,.18),transparent 28%),linear-gradient(135deg,rgba(22,199,132,.20),rgba(255,255,255,.055));border-radius:32px;padding:30px;box-shadow:var(--shadow);margin:16px 0;position:relative;overflow:hidden}

  document.head.appendChild(Object.assign(document.createElement('style'),{textContent:css}));
  function norm(v){return String(v||'').toLowerCase().replace(/[ً-ٰٟ]/g,'').replace(/\s+/g,' ').trim();}
  function ensureModule(k){ if(!window.learning) window.learning={}; if(!learning[k]) learning[k]=[]; }
  function addUnique(k,arr){ensureModule(k); const seen=new Set(learning[k].map(x=>norm((x.name||'')+'|'+(x.arabic||'')+'|'+(x.meaning||'')))); arr.forEach(x=>{x.audioText=x.audioText||x.arabic||x.latin||x.meaning||x.name||''; const key=norm((x.name||'')+'|'+(x.arabic||'')+'|'+(x.meaning||'')); if(!seen.has(key)&&!learning[k].some(y=>y.id===x.id)){learning[k].push(x);seen.add(key);}});}
  function clean(k){ensureModule(k); const out=[],seen=new Set(); learning[k].forEach(x=>{x.audioText=x.audioText||x.arabic||x.latin||x.meaning||x.name||''; const key=norm((x.name||'')+'|'+(x.arabic||'')+'|'+(x.meaning||'')); if(!seen.has(key)){seen.add(key);out.push(x);} }); learning[k]=out;}

  window.getAudioAudit=function(){const keys=['hijaiyah','iqro','tajwid','sholat','doa','materi','hadithLocal'];let total=0,missing=0,dupes=0;keys.forEach(k=>{const arr=learning[k]||[];total+=arr.length;const s=new Set();arr.forEach(x=>{const text=x.audioText||x.arabic||x.latin||x.meaning||x.name;if(!String(text||'').trim())missing++;const key=norm((x.name||'')+'|'+(x.arabic||'')+'|'+(x.meaning||''));if(s.has(key))dupes++;s.add(key);});});return {total,missing,dupes,doa:(learning.doa||[]).length,materi:(learning.materi||[]).length,hadith:(learning.hadithLocal||[]).length};};
  const baseSpeak=window.speak;
  window.speak=function(text,label){text=String(text||'').replace(/\s+/g,' ').trim();if(!text){toast&&toast('Audio belum tersedia untuk item ini');return;}last={type:'tts',text,label};setNow&&setNow(label||'Audio');const mp3=document.getElementById('mp3');if(mp3)mp3.pause();if(!('speechSynthesis' in window)){toast&&toast('Browser tidak mendukung TTS');return;}speechSynthesis.cancel();const isArabic=/[اأإآء-ي]/.test(text);let u=new SpeechSynthesisUtterance(text);u.lang=isArabic?'ar-SA':'id-ID';const rateEl=document.getElementById('rate');u.rate=rateEl?+rateEl.value:(isArabic?.76:1);let chosen=null;if(isArabic)chosen=(voices||[]).find(v=>/ar|arab|saudi/i.test(v.lang+' '+v.name));if(!chosen&&!isArabic)chosen=(voices||[]).find(v=>/id|indonesia/i.test(v.lang+' '+v.name));if(!chosen)chosen=(voices||[]).find(v=>v.name===document.getElementById('voice')?.value);if(chosen)u.voice=chosen;speechSynthesis.speak(u);};

  const oldStats=window.getStats;

  window.hadith=function(){const arr=learning.hadithLocal||[];return `<div class="hero"><h2>Hadis Shahih & Adab Harian</h2><p>Koleksi hadis lokal/offline ditambah, dilengkapi Arab, arti, sumber, pencarian, dan audio TTS. Gunakan API jika ingin nomor hadis lain saat online.</p><div class="guardPanel"><b>Audit Hadis</b><br><span class="guardPill">${arr.length} hadis lokal</span><span class="guardPill">Audio fallback aktif</span><span class="guardPill">Duplikasi dibersihkan</span></div></div><div class="filterPanel"><div class="filterGrid"><div><label class="filterLabel">Pencarian hadis</label><input id="searchHadithLocal" placeholder="Cari niat, Quran, sholat, akhlak, ilmu..." oninput="filterHadithLocal()"></div><div><label class="filterLabel">Sumber API</label><select id="book"><option value="bukhari">Bukhari</option><option value="muslim">Muslim</option><option value="tirmidzi">Tirmidzi</option></select></div><div><label class="filterLabel">Nomor</label><input id="hn" type="number" value="1" min="1"></div><button class="btn" onclick="loadHadith()">Cari API</button></div></div><div id="hr"></div><div class="grid" id="hadithLocalCards">${arr.map(x=>card(x)).join('')}</div>`;};
  window.filterHadithLocal=function(){const q=norm(document.getElementById('searchHadithLocal')?.value||'');const arr=(learning.hadithLocal||[]).filter(x=>norm(JSON.stringify(x)).includes(q));const el=document.getElementById('hadithLocalCards');if(el)el.innerHTML=arr.map(x=>card(x)).join('')||'<div class="card full"><p class="muted">Tidak ada hadis lokal yang cocok.</p></div>';};
  window.proSearchGo=function(){const q=document.getElementById('globalSearch')?.value||''; if(!q.trim()){view='materi';render();return;} view='materi'; render(); setTimeout(()=>{const s=document.getElementById('searchLesson'); if(s){s.value=q; applyFilters&&applyFilters();}},50);};
  window.home=function(){const st=getStats(),a=getAudioAudit();const quick=(window.menus||[]).slice(1).map(m=>`<div class="card"><span class="guardPill">🔊 Audio siap</span><h3>${m[1]}</h3><p class="muted">Modul premium dengan filter, progress, bookmark, dan audio fallback.</p><button class="btn primary" onclick="view='${m[0]}';render()">Buka</button></div>`).join('');return `<div class="guardianHero"><span class="guardianLabel">🌙 ${VERSION} • Content Guard</span><h2>Aldora Mengaji Enterprise</h2><p>Upgrade ini memperbanyak doa, hadis, tajwid, makhraj, sholat, hafalan, adab, dan evaluasi. Sistem juga membersihkan duplikasi aktif dan memastikan semua kartu punya teks audio fallback agar tombol audio tidak kosong.</p><div class="guardGrid"><div class="guardMetric"><b>${st.doa}</b><span>Doa</span></div><div class="guardMetric"><b>${st.hadithLocal}</b><span>Hadis lokal</span></div><div class="guardMetric"><b>${st.materi}</b><span>Materi panduan</span></div><div class="guardMetric"><b>${a.missing}</b><span>Audio kosong</span></div><div class="guardMetric"><b>${a.dupes}</b><span>Duplikasi aktif</span></div><div class="guardMetric"><b>114</b><span>Surat Quran</span></div></div><div class="ultraSearch" style="margin-top:16px"><div class="row"><input id="globalSearch" placeholder="Cari doa, hadis, tajwid, sholat, hafalan..." onkeydown="if(event.key==='Enter')proSearchGo()"><button class="btn primary" onclick="proSearchGo()">Cari</button></div></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="view='doa';render()">Doa</button><button class="btn" onclick="view='hadith';render()">Hadis</button><button class="btn" onclick="view='materi';render()">Materi</button><button class="btn" onclick="view='tajwid';render()">Tajwid</button></div></div><div class="grid"><div class="card full"><h3>Upgrade v18</h3><div class="checklist"><div class="checkline"><b>✓</b><span>Tambah 40 doa harian baru dengan Arab, latin, arti, dan audioText.</span></div><div class="checkline"><b>✓</b><span>Tambah 25 hadis ringkas lokal/offline agar menu hadis tetap berisi tanpa internet.</span></div><div class="checkline"><b>✓</b><span>Tambah 50 materi panduan tajwid, makhraj, waqaf, hafalan, sholat, dan evaluasi.</span></div><div class="checkline"><b>✓</b><span>Audio Guard: setiap item dicek agar punya fallback audio dan duplikasi aktif dibersihkan.</span></div></div></div><div class="card full"><h3>Catatan Keakuratan</h3><p class="muted">Secara teknis sudah dicek agar tidak ada audio kosong dan duplikasi aktif. Untuk bacaan Arab benar 100% secara tajwid, rilis final tetap sebaiknya divalidasi guru tajwid/qari dan memakai rekaman asli, karena TTS browser tidak sama dengan murattal profesional.</p></div></div><div class="moduleQuick">${quick}</div><div class="appFooter">Aldora Mengaji Enterprise • ${VERSION}</div>`;};
  const prevRender=window.render;
  window.render=function(){ if(typeof nav==='function') nav(); const v=document.getElementById('view'); if(view==='home'&&v){v.innerHTML=home();return} if(view==='hadith'&&v){v.innerHTML=hadith();return} return prevRender&&prevRender(); };
  setTimeout(()=>{try{if(window.view==='home')render();}catch(e){console.warn(e)}},0);
